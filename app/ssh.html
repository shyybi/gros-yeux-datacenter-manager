<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Gros'Yeux - SSH Manager</title>
</head>
<body>
	<div class="page-order">
		<!-- Here is the left side-->
		<div class="left-side" id="left-side">
			<div class="navbar">
				<a href="#" class="app-title">Gros'Yeux</a>
				<a href="index.html" class="link">Servers</a>
				<a href="logs.html" class="link">Logs</a>
				<a href="ssh.html" class="link">Ssh</a>
				<a href="settings.html" class="link">Settings</a>
				<a target="_blank" href="https://github.com/shyybi/gros-yeux-datacenter-manager/" class="link" rel="noopener noreferrer">Git</a>
			</div>
			<div class="navbar">
				<a class="credit">Made by Shyybi</a>
			</div>
		</div>
		<!-- Here is the wide side-->
		<div class="wide-side" id="wide-side">
			<h1>SSH Manager</h1>
			<div>
				<select id="server-select">
					<!-- Options will be populated dynamically -->
				</select>
			</div>
			<div class="ssh-form">
				<input type="text" id="ssh-username" placeholder="Username">
				<input type="password" id="ssh-password" placeholder="Password">
				<button id="connect-ssh-btn">Connect</button>
			</div>
			<div id="ssh-terminal-container">
				<!-- Terminal will be rendered here -->
			</div>
			<div class="ssh-command-container">
				<button id="open-terminal-btn">Open Terminal</button>
			</div>

			<!-- Modal for terminal -->
			<div id="terminal-modal" class="modal hidden">
				<div class="modal-content">
					<span id="close-terminal-btn" class="close">&times;</span>
					<div id="terminal-window" class="terminal-window">
						<!-- Simulated terminal content will be rendered here -->
					</div>
					<input type="text" id="terminal-input" placeholder="Enter command here...">
				</div>
			</div>
		</div>
	</div>
</body>
<script src="renderer.js"></script>
</html>
